    .bar-reveal { width: 0; animation: bar-grow 1.5s 0.8s cubic-bezier(.2,.7,.2,1) forwards; }

    @keyframes fade-in { to { opacity: 1; } }
    @keyframes ring-fill { to { stroke-dasharray: 46.9 289; } }
